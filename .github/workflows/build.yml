name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test + build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # --- HIER EINGEFÜGT: Behebt den "Permission denied" Fehler ---
      - name: Make gradlew executable
        run: chmod +x gradlew

      # The Android SDK is preinstalled on ubuntu-latest; the Gradle plugin downloads missing parts itself.
      - name: Android SDK
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk" ]; then
            echo "::error::Android SDK not found (ANDROID_HOME / ANDROID_SDK_ROOT)"
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$sdkmanager" ]; then
            yes | "$sdkmanager" --licenses > /dev/null || true
            "$sdkmanager" "platforms;android-36" > /dev/null
          fi

      # Tag builds are what the in-app update check offers: the tag must match versionName, otherwise the app would
      # keep reporting an update (or never report one). The version's changelog sections (release notes, About tab)
      # are checked here as well, before the long build.
      - name: Check tag against versionName and changelogs
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName \"$version\" in app/build.gradle.kts"
            exit 1
          fi
          missing=()
          for f in CHANGELOG.md CHANGELOG.de.md app/src/main/res/raw*/changelog.md; do
            # heading "## 1.2.0" or "## v1.2.0", more text may follow ("## 1.2.0 - 2026-10-06")
            if ! awk -v v="$version" '/^## / { h = $2; sub(/^v/, "", h); if (h == v) { found = 1; exit } } END { exit !found }' "$f"; then
              missing+=("$f")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::No '## $version' section in: ${missing[*]} (see README, Publishing a release)"
            exit 1
          fi

      # Release signing, for v* tags only: SIGNING_KEYSTORE_BASE64 (base64 of the .jks / .keystore file) plus the
      # passwords and the key alias. Branch and pull request builds stay unsigned, so no build of work in progress
      # carries the release key. Only the keystore path goes into GITHUB_ENV; the passwords reach the build step alone.
      - name: Signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "No signing keystore secret - the release APK stays unsigned (and the release job refuses it)."
            exit 0
          fi
          if [ -z "$SIGNING_KEYSTORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is set, but SIGNING_KEYSTORE_PASSWORD or SIGNING_KEY_ALIAS is missing"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "SIGNING_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "Release APK will be signed (key alias from secrets)."

      # The Discord application ID is baked in as the default; without it the app asks the user for an own one.
      # Only passed when the secret exists, so an ID in gradle.properties is not overwritten with an empty value.
      # A release (v* tag) needs a valid ID, so that the published APK works without setup; other builds only warn.
      # Signing passwords: only on v* tags (they are used only if the previous step decoded a keystore).
      # SIGNING_KEY_PASSWORD falls back to the keystore password: a PKCS12 keystore (keytool's default) has only one.
      - name: Test and build
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          SIGNING_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNING_KEYSTORE_PASSWORD || '' }}
          SIGNING_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNING_KEY_ALIAS || '' }}
          SIGNING_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && (secrets.SIGNING_KEY_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD) || '' }}
        run: |
          valid_id() { [[ "$1" =~ ^[0-9]{17,20}$ ]]; }
          args=()
          if [ -n "$DISCORD_APPLICATION_ID" ]; then
            id=$(printf '%s' "$DISCORD_APPLICATION_ID" | tr -d '[:space:]')
            if ! valid_id "$id"; then
              echo "::error::The secret DISCORD_APPLICATION_ID is not a Discord application ID (17 to 20 digits)"
              exit 1
            fi
            args+=("-PdiscordApplicationId=$id")
          else
            id=$(sed -n 's/^[[:space:]]*discordApplicationId[[:space:]]*[=:][[:space:]]*//p' gradle.properties | tail -n 1 | tr -d '[:space:]')
            if [ -n "$id" ] && ! valid_id "$id"; then
              echo "::error::discordApplicationId in gradle.properties is not a Discord application ID (17 to 20 digits)"
              exit 1
            fi
            if [ -z "$id" ]; then
              if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                echo "::error::A release needs a Discord application ID: add the secret DISCORD_APPLICATION_ID (see README, Publishing a release)"
                exit 1
              fi
              echo "::warning::No Discord application ID (secret DISCORD_APPLICATION_ID or gradle.properties) - users must enter their own"
            fi
          fi
          ./gradlew --stacktrace "${args[@]}" :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Verify release signature
        if: env.SIGNING_KEYSTORE_PATH != ''
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PowerampDiscordRP-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # app-release.apk when signed (v* tags), app-release-unsigned.apk otherwise
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: PowerampDiscordRP-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PowerampDiscordRP-release
          path: release-apk

      # An unsigned APK cannot be installed - a release needs the signing secrets.
      - name: Prepare APK + checksum
        run: |
          if [ ! -f release-apk/app-release.apk ]; then
            echo "::error::The release APK is unsigned. Add the secrets SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD and"
